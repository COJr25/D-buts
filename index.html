<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lunarix One</title>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Inter:wght@400&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       RESET & BASE
    ============================================= */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* =============================================
       WRAPPER — le design est conçu en 1920×1080.
       On le scale pour remplir la fenêtre tout en
       gardant les proportions exactes de Figma.
    ============================================= */
    #app {
      position: absolute;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
    }

    /* =============================================
       FRAME PRINCIPAL - PLEIN ÉCRAN SANS BORDURES
    ============================================= */
    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Urbanist', sans-serif;
    }

    /* --------- ARRIÈRE-PLAN - COUVRE TOUT --------- */
    .bg {
      position: absolute;
      inset: 0;
    }
    .bg img {
      position: absolute;
      width:100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* =============================================
       GLASSMORPHISM — LE VRAI STYLE FIGMA
    ============================================= */
    .glass {
      backdrop-filter: blur(52.65px);
      -webkit-backdrop-filter: blur(52.65px);
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(255,255,255,0.1) 100%);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 1px 13px 19.8px 0 rgba(0,0,0,0.03),
                  inset 0 1px 0 rgba(255,255,255,0.4),
                  inset 0 -1px 0 rgba(255,255,255,0.15);
    }
    .glass-sm {
      backdrop-filter: blur(43.25px);
      -webkit-backdrop-filter: blur(43.25px);
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(255,255,255,0.1) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
    }

    /* =============================================
       LOGO (top-left)
    ============================================= */
    .logo {
      position: absolute;
      left: 40px;
      top: 51.5px;
      width: 56px;
      height: 40px;
    }
    .logo svg { width: 100%; height: 100%; }

    /* =============================================
       NAVIGATION CENTRALE (top)
    ============================================= */
    .nav-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 37.99px;
      width: 338px;
      height: 67px;
      border-radius: 60px;
    }
    .nav-center .glass-sm {
      position: absolute;
      inset: 0;
      border-radius: 60px;
    }
    .nav-center .nav-items {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5.5px;
    }
    .nav-btn {
      height: 56px;
      padding: 18px 20px;
      border-radius: 60px;
      font-family: 'Urbanist', sans-serif;
      font-size: 16px;
      color: white;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      background: transparent;
      border: none;
      transition: background 0.2s;
    }
    .nav-btn.active {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(52.65px);
    }
    .nav-btn:hover:not(.active) {
      background: rgba(255,255,255,0.1);
    }

    /* =============================================
       BOUTONS TOP-RIGHT (paramètres + globe)
    ============================================= */
    .top-right-btns {
      position: absolute;
      right: 40px;
      top: 37.99px;
      width: 133px;
      height: 67px;
      border-radius: 60px;
    }
    .top-right-btns .glass-sm {
      position: absolute;
      inset: 0;
      border-radius: 60px;
    }
    .top-right-btns .btn-group {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 5px;
    }
    .icon-btn {
      width: 59px;
      height: 59px;
      border-radius: 29px;
      background: rgba(255,255,255,0.05);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.15); }
    .icon-btn svg { width: 28px; height: 28px; stroke: white; fill: none; }

    /* =============================================
       PRODUIT — bague centrale
    ============================================= */
    .product-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .product-ring img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 60px rgba(200, 100, 50, 0.35));
    }

    /* =============================================
       PANNEAU DROIT — profil utilisateur
    ============================================= */
    .right-panel {
      position: absolute;
      right: 80px;
      top: 160px;
      width: 417.5px;
      height: 700px;
    }
    .right-panel .oval-card {
      position: absolute;
      left: 14.64px;
      top: 27.49px;
      width: 388px;
      height: 672.5px;
      border-radius: 320px;
      backdrop-filter: blur(52.65px);
      -webkit-backdrop-filter: blur(52.65px);
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(255,255,255,0.1) 100%);
      border: 1px solid rgba(255,255,255,0.0);
      box-shadow:
        inset 0 -1px 0 rgba(255,255,255,0.5),
        inset 0 1px 0 rgba(255,255,255,0.5),
        inset 0 0 40px rgba(0,0,0,0.24);
    }
    .right-panel .profile-photo {
      position: absolute;
      left: 33px;
      top: 50px;
      width: 352px;
      height: 300px;
      object-fit: cover;
      object-position: top center;
      border-radius: 100%;
    }
    .right-panel .ring-runner {
      position: absolute;
      left: 9px;
      top: -4px;
      width: 500px;
      height: 300px;
      pointer-events: none;
    }
    .right-panel .glow-overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 417.5px;
      height: 432.8px;
      mix-blend-mode: screen;
      overflow: hidden;
      pointer-events: none;
    }
    .right-panel .glow-overlay img {
      position: absolute;
      width: 168.74%;
      height: 108.5%;
      left: -34.07%;
      top: -3.61%;
      max-width: none;
    }
    .right-panel .stats-row {
      position: absolute;
      bottom: 220px;
      left: 63px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .stat-block { display: flex; flex-direction: column; gap: 6px; color: white; }
    .stat-label {
      font-family: 'Urbanist', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: white;
      line-height: 1.2;
    }
    .stat-value {
      font-family: 'Urbanist', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: white;
      line-height: 1.2;
    }
    .stat-unit {
      font-size: 14px;
      font-weight: 400;
      color: #dde0e2;
    }
    .stat-divider {
      width: 2px;
      height: 32px;
      background: #e8edff;
      border-radius: 4px;
    }
    .progress-circle-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 295.5px;
      height: 295.5px;
    }
    .progress-circle-container img {
      width: 100%;
      height: 100%;
      transform: scaleY(-1);
    }
    .weight-text {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: white;
    }
    .weight-text .weight-val {
      font-size: 22px;
      font-weight: 700;
      font-family: 'Urbanist', sans-serif;
    }
    .weight-text .weight-label {
      font-size: 14px;
      font-weight: 500;
      font-family: 'Urbanist', sans-serif;
      opacity: 0.85;
    }

    /* =============================================
       JOURNAL CARD (top-left)
    ============================================= */
    .journal-card {
      position: absolute;
      left: 120px;
      top: 200px;
      width: 320px;
      border-radius: 22px;
      padding: 12px;
      overflow: hidden;
    }
    .journal-card .journal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 21px;
    }
    .journal-card .journal-date {
      font-family: 'Urbanist', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #f0f0f0;
      line-height: 20px;
      letter-spacing: -0.1px;
    }
    .journal-card .journal-icon {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .journal-card .journal-icon svg { width: 20px; height: 20px; stroke: #f0f0f0; fill: none; }
    .journal-card .journal-title {
      font-family: 'Urbanist', sans-serif;
      font-size: 23.5px;
      font-weight: 400;
      background: linear-gradient(90deg, #fff 0%, #999 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 30px;
      letter-spacing: -0.3px;
      margin-bottom: 21px;
    }
    .journal-card .journal-btns {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .journal-btn {
      height: 32px;
      border-radius: 100px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-family: 'Urbanist', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      transition: background 0.2s;
      letter-spacing: -0.1px;
    }
    .journal-btn:hover { background: rgba(255,255,255,0.3); }
    .journal-btn svg { width: 14px; height: 14px; stroke: white; fill: none; }

    /* =============================================
       ACTIVITÉ RUNNING (middle-left)
    ============================================= */
    .activity-card {
      position: absolute;
      left: 120px;
      top: 400px;
      width: 320px;
      height: 150px;
      border-radius: 30px;
    }
    .activity-inner {
      position: absolute;
      left: 18px;
      top: 12px;
      width: 140px;
    }
    .activity-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
    }
    .activity-title-row svg { width: 35px; height: 35px; stroke: white; fill: none; }
    .activity-title {
      font-size: 20px;
      font-weight: 600;
      color: white;
    }
    .activity-label {
      font-size: 12px;
      font-weight: 400;
      color: #f0f0f0;
      margin-bottom: 4px;
    }
    .activity-km {
      font-size: 22px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }
    .activity-time {
      font-size: 12px;
      font-weight: 400;
      color: #f0f0f0;
    }
    .activity-map {
      position: absolute;
      right: 10px;
      top: 14px;
      width: 173px;
      height: 142px;
      overflow: visible;
    }
    .activity-map img { width: 100%; height: 100%; object-fit: contain; }

    /* =============================================
       CALORIES CARD
    ============================================= */
    .calories-card {
      position: absolute;
      left: 120px;
      top: 580px;
      width: 150px;
      height: 120px;
      border-radius: 30px;
      padding: 14px 23px;
    }
    .calories-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .calories-title {
      font-size: 20px;
      font-weight: 600;
      color: white;
    }
    .calories-icon svg { width: 36px; height: 36px; stroke: white; fill: none; }
    .calories-value {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 600;
      color: white;
    }
    .calories-value span {
      font-size: 16px;
      font-weight: 400;
      color: #f0f0f0;
    }

    /* =============================================
       HEART RATE CARD
    ============================================= */
    .heart-card {
      position: absolute;
      left: 285px;
      top: 580px;
      width: 150px;
      height: 120px;
      border-radius: 30px;
    }
    .heart-card-inner {
      position: relative;
      width: 182px;
      height: 135px;
    }
    .heart-title {
      position: absolute;
      left: 14px;
      top: 25px;
      font-size: 20px;
      font-weight: 600;
      color: white;
    }
    .heart-icon {
      position: absolute;
      right: 14px;
      top: 19px;
      width: 36px;
      height: 36px;
    }
    .heart-icon svg { width: 100%; height: 100%; stroke: white; fill: none; }
    .heart-bpm {
      position: absolute;
      left: 22px;
      top: 68px;
      font-size: 18px;
      font-weight: 600;
      color: white;
    }
    .heart-unit {
      position: absolute;
      left: 14px;
      top: 92px;
      font-size: 17px;
      font-weight: 400;
      color: #f0f0f0;
    }
    .heart-graph {
      position: absolute;
      right: 10px;
      top: 65px;
      width: 106px;
      height: 36.5px;
    }
    .heart-graph svg { width: 100%; height: 100%; stroke: rgba(255,255,255,0.6); fill: none; }

    /* =============================================
       BARRE LATÉRALE GAUCHE
    ============================================= */
    .left-sidebar {
      position: absolute;
      left: 40px;
      top: 473.8px;
      width: 67px;
      height: 132px;
    }
    .sidebar-pill {
      position: absolute;
      inset: 0;
      border-radius: 60px;
      transform: rotate(90deg);
      transform-origin: center center;
    }
    .sidebar-icons {
      position: absolute;
      left: 44px;
      top: 478px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .sidebar-icon-btn {
      width: 59px;
      height: 59px;
      border-radius: 29px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(52.65px);
      border: 1px solid rgba(255,255,255,0.0);
      box-shadow: 1px 13px 19.8px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sidebar-icon-btn:hover { background: rgba(255,255,255,0.12); }
    .sidebar-icon-btn svg { width: 27px; height: 27px; stroke: white; fill: none; }

    /* =============================================
       BARRE DE NAVIGATION DU BAS
    ============================================= */
    .nav-schedule {
      position: absolute;
      left: 40px;
      top: 951.4px;
      width: 153px;
      height: 75px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 7px 5px;
    }
    .schedule-icon {
      width: 59px;
      height: 59px;
      border-radius: 29px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(52.65px);
      border: 1px solid rgba(255,255,255,0.0);
      box-shadow: 1px 13px 19.8px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .schedule-icon svg { width: 24px; height: 24px; stroke: white; fill: none; }
    .schedule-label {
      font-size: 12px;
      font-weight: 400;
      color: white;
      white-space: nowrap;
    }

    .nav-bottom-icons {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 951.4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bottom-icon-btn {
      width: 82.5px;
      height: 75px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .bottom-icon-btn svg { width: 24px; height: 24px; stroke: white; fill: none; }

    .center-btn-wrapper {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 927px;
      width: 123px;
      height: 123px;
    }
    .center-btn-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #000000 0%, #FFFFFF 100%);
      border-radius: 50%;
      box-shadow:
        0 0 86px rgba(255, 255, 255, 0.4),
        0 0 15px rgba(0, 0, 0, 0.2);
    }
    .center-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .center-btn svg { width: 37px; height: 37px; stroke: white; fill: none; }

    .nav-tabs-right {
      position: absolute;
      right: 80px;
      top: 955px;
      border-radius: 60px;
      padding: 5px;
    }
    .nav-tabs-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tab-btn {
      height: 56px;
      padding: 18px 20px;
      border-radius: 60px;
      font-family: 'Urbanist', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: white;
      background: transparent;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .tab-btn.active {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(52.65px);
    }
    .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.1); }

    .clickable { cursor: pointer; }
    .clickable:active { opacity: 0.75; transform: scale(0.97); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .journal-card  { animation: fadeUp 0.6s ease 0.1s both; }
    .activity-card { animation: fadeUp 0.6s ease 0.2s both; }
    .calories-card { animation: fadeUp 0.6s ease 0.3s both; }
    .heart-card    { animation: fadeUp 0.6s ease 0.35s both; }
    .right-panel   { animation: fadeUp 0.6s ease 0.15s both; }
  </style>
</head>
<body>

<div id="app">
  <div class="frame">

    <!-- ARRIÈRE-PLAN -->
    <div class="bg">
      <img src="assets/clouds-bg.png" alt="" />
    </div>

    <!-- LOGO -->
    <div class="logo">
      <svg viewBox="0 0 56 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 20C10 14 16 8 28 8C40 8 46 14 46 20C46 26 40 32 28 32" stroke="white" stroke-width="4" stroke-linecap="round"/>
        <circle cx="28" cy="20" r="6" fill="white"/>
      </svg>
    </div>

    <!-- NAVIGATION CENTRALE -->
    <div class="nav-center">
      <div class="glass-sm"></div>
      <div class="nav-items">
        <button class="nav-btn active" onclick="setNav(this)">Overview</button>
        <button class="nav-btn" onclick="setNav(this)">Apps</button>
        <button class="nav-btn" onclick="setNav(this)">Store</button>
      </div>
    </div>

    <!-- BOUTONS TOP-RIGHT -->
    <div class="top-right-btns">
      <div class="glass-sm"></div>
      <div class="btn-group">
        <button class="icon-btn">
          <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button class="icon-btn">
          <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
      </div>
    </div>

    <!-- BAGUE CENTRALE -->
    <div class="product-ring">
      <img src="assets/ring.png" alt="Lunarix One Smart Ring" />
    </div>

    <!-- PANNEAU DROIT (profil) -->
    <div class="right-panel">
      <div class="oval-card"></div>
      <img class="profile-photo" src="assets/runner.png" alt="Runner"/>
      <img class="ring-runner" src="assets/ring-runner.png" alt="Ring-runner"/>
      <div class="stats-row">
        <div class="stat-block">
          <div class="stat-label">Weight Loss</div>
          <div class="stat-value">8.5 <span class="stat-unit">kg</span></div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-block">
          <div class="stat-label">Calories Loss</div>
          <div class="stat-value">6.4K <span class="stat-unit">kcl</span></div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-block">
          <div class="stat-label">Challenges</div>
          <div class="stat-value">3 <span class="stat-unit">chal</span></div>
        </div>
      </div>
      <div class="weight-text">
        <div class="weight-val">76.5kg</div>
        <div class="weight-label">Current Weight</div>
      </div>
    </div>

    <!-- JOURNAL CARD -->
    <div class="journal-card glass">
      <div class="journal-header">
        <span class="journal-date">Monday, Jun 7</span>
        <div class="journal-icon">
          <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </div>
      </div>
      <p class="journal-title">How will you make tomorrow meaningful?</p>
      <div class="journal-btns">
        <button class="journal-btn">
          <svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          New Entry
        </button>

    <!-- HEART RATE CARD -->

        </div>

        <div class="heart-graph">

    <div class="left-sidebar">
      <div class="sidebar-pill glass-sm" style="width:132px;height:67px;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);"></div>

      <button class="sidebar-icon-btn">

    <div class="nav-bottom-icons">

      <div class="bottom-icon-btn glass-sm clickable">

      <div class="center-btn clickable">

    <!-- TABS BAS-DROITE -->
    <div class="nav-tabs-right glass">
      <div class="nav-tabs-inner">
        <button class="tab-btn active" onclick="setTab(this)">Journey</button>

        <button class="tab-btn" onclick="setTab(this)">Duels</button>

  </div>
</div>

<script>
  function scaleApp() {
    const app = document.getElementById('app');
    const scaleX = window.innerWidth / 1920;
    const scaleY = window.innerHeight / 1080;
    const scale = Math.max(scaleX, scaleY);
    const offsetX = (window.innerWidth - 1920 * scale) / 2;
    const offsetY = (window.innerHeight - 1080 * scale) / 2;
    app.style.transform = `scale(${scale})`;
    app.style.left = offsetX + 'px';
    app.style.top = offsetY + 'px';
  }
  scaleApp();
  window.addEventListener('resize', scaleApp);

  function setNav(btn) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  function setTab(btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  const bpmEl = document.querySelector('.heart-bpm');
  let bpm = 94;
  setInterval(() => {
    bpm = 88 + Math.floor(Math.random() * 14);
    bpmEl.textContent = bpm;
  }, 2000);
</script>

</body>
